name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Install, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NODE_ENV: test
      CI: "true"
      AI_FAKE: "1"
      # Keep mongodb-memory-server binaries in a predictable cache directory.
      MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # mongodb-memory-server downloads a MongoDB binary on its first run.
      # Caching it keeps CI fast and resilient on subsequent builds.
      - name: Cache MongoDB memory server binary
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            mongodb-binaries-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Run server tests (Vitest + Supertest + mongodb-memory-server)
        run: npm test

      - name: Build client
        run: npm run build

      - name: Verify client build output exists
        run: test -f client/dist/index.html
